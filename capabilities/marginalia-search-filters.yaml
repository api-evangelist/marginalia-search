    baseUri: https://api2.marginalia-search.com
    description: Marginalia Search API — Filters business capability. Self-contained, no shared references.
    resources:
    - name: filter
      path: /filter
      operations:
      - name: listfilters
        method: GET
        description: List configured filters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: filter-name
      path: /filter/{name}
      operations:
      - name: getfilter
        method: GET
        description: Retrieve a filter definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createfilter
        method: POST
        description: Create a named filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletefilter
        method: DELETE
        description: Delete a filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
