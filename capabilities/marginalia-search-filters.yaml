      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: marginalia-search-filters.createfilter
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-filter
      description: Delete a filter
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: marginalia-search-filters.deletefilter
      outputParameters:
      - type: object
        mapping: $.
